name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        shell: bash
        run: gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Mostrar errores
        if: failure()
        run: grep -E "^e: " build.log | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/*.apk